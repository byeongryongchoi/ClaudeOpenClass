<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌿 방명록</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="page">
    <header class="hero">
      <div class="hero-leaf">🌿</div>
      <h1>방명록</h1>
      <p class="subtitle">다녀가신 흔적을 남겨주세요</p>
    </header>

    <section class="card form-card">
      <form id="entry-form" novalidate>
        <div class="form-row">
          <div class="field">
            <label for="name">이름</label>
            <input type="text" id="name" maxlength="20" placeholder="닉네임" required>
          </div>
          <div class="field">
            <label for="password">비밀번호</label>
            <input type="password" id="password" maxlength="30" placeholder="삭제 시 필요해요" required>
          </div>
          <div class="field mood-field">
            <label for="mood">기분</label>
            <select id="mood">
              <option value="😊">😊 좋음</option>
              <option value="🥰">🥰 최고</option>
              <option value="😢">😢 슬픔</option>
              <option value="😆">😆 신남</option>
              <option value="🌱">🌱 평온</option>
              <option value="🎉">🎉 축하</option>
            </select>
          </div>
        </div>
        <div class="field">
          <label for="message">방명록 내용</label>
          <textarea id="message" maxlength="300" rows="3" placeholder="따뜻한 한마디를 남겨주세요 :)" required></textarea>
          <span class="char-count"><span id="char-count">0</span>/300</span>
        </div>
        <p class="error-msg" id="form-error"></p>
        <button type="submit" class="btn-submit">방명록 남기기</button>
      </form>
    </section>

    <section class="list-section">
      <div class="list-header">
        <h2>남겨진 방명록</h2>
        <span class="count-badge"><span id="entry-count">0</span>개</span>
      </div>
      <div id="entry-list" class="entry-list"></div>
      <p id="empty-msg" class="empty-msg" hidden>아직 방명록이 없어요. 첫 글의 주인공이 되어보세요! 🌱</p>
    </section>
  </div>

  <div id="delete-modal" class="modal" hidden>
    <div class="modal-box">
      <h3>비밀번호 확인</h3>
      <p>삭제하려면 작성 시 입력한 비밀번호를 입력해주세요.</p>
      <input type="password" id="delete-password" placeholder="비밀번호">
      <p class="error-msg" id="delete-error"></p>
      <div class="modal-actions">
        <button class="btn-secondary" id="cancel-delete">취소</button>
        <button class="btn-danger" id="confirm-delete">삭제</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
